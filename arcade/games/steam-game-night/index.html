<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Steam Game Night</title><link rel='stylesheet' href='style.css'></head><body><main><h1>🎮 Steam Game Night</h1><p class='sub'>Add public Steam profile links, then build a shared-game wheel.</p><section class='card'><h2>Players</h2><div id='players'></div><div class='row'><button id='add'>+ Add Player</button><button id='check' class='primary'>Check Games</button></div><p id='status'></p></section><section class='card'><div class='filters'><label>Ownership <select id='ownership'><option value='all'>Everyone</option><option value='2'>At least 2 players</option></select></label></div><h2>Matching Games <span id='count'>0</span></h2><div id='games' class='games'></div></section><section class='card wheel-card'><h2>Game Wheel</h2><div class='pointer'>▼</div><canvas id='wheel' width='520' height='520'></canvas><button id='spin' class='primary big'>🎡 Spin</button><h2 id='winner'></h2></section><section class='card note'><strong>Live mode:</strong> Libraries are checked from Steam when you press <em>Check Games</em>. Nothing is permanently saved. Players must have Steam <strong>Game details</strong> set to Public.</section></main><script src='app.js'></script></body></html>
